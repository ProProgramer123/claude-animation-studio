name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test

  cpp:
    name: C++ engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build cpp/build --config Release --parallel
      - run: ctest --test-dir cpp/build -C Release --output-on-failure
      - name: Offline run with the mock agents
        shell: bash
        run: |
          exe=cpp/build/animation-studio
          [ -f cpp/build/Release/animation-studio.exe ] && exe=cpp/build/Release/animation-studio.exe
          "$exe" --runner mock --out out/mock "a bouncing ball"
          test -f out/mock/index.html
